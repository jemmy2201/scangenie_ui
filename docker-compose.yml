services:
  nginx:
    image: nginx:alpine
    container_name: sigma2k_ui
    ports:
      - "82:80"
    volumes:
      - ./nginx-sigma2k_ui.conf:/etc/nginx/nginx.conf
      - ./:/var/www  # Mount the dist folder from your local machine to the container
    depends_on:
      - nodejs
    restart: always
    networks:
      - app-network

  nodejs:
    image: node:16-alpine
    container_name: Sigma2k_ui
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: ["npm", "run", "serve"]
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
